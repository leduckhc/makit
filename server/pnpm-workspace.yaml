# pnpm workspace + security settings. See SECURITY.md.

# Refuse to install any package whose lifecycle/build script is not on the
# allowBuilds list below. Hard failure, not a warning.
strictDepBuilds: true

# Reject transitive deps that pull git/tarball sources.
blockExoticSubdeps: true

# 7-day cooldown — refuse to install a version published less than 7 days
# ago. Catches the typical malicious-publish window.
minimumReleaseAge: 10080

# Bypass list — only for packages where waiting 7 days is impractical
# (typescript, @types/*). Add new entries with a one-line justification.
minimumReleaseAgeExclude:
  - typescript
  - "@types/node"
  - "@types/qrcode-terminal"
  - "@types/ws"
  # SPEC-26 needs the 1.x SDK for `session.configOptions` typing; 1.3.0 is the
  # first release carrying it and is <7 days old at bump time. First-party ACP
  # package, pinned in the lockfile — accepted per this spec's SDK-bump step.
  - "@agentclientprotocol/sdk"

# Lifecycle-script allow-list. Each entry is a security review: confirm the
# script doesn't phone home or write to $HOME on install.
allowBuilds:
  # esbuild is a transitive of `tsx`. Postinstall downloads a platform-
  # specific native binary from npm. Widely audited, low risk.
  esbuild: true
  # pi-decimals is a transitive of `pi`. Postinstall compiles platform-specific
  # native code. Pi is widely used in the agent ecosystem; pi-decimals is a
  # standard build. Low risk.
  pi-decimals: false

# Refuse downgrades from provenance-published versions (Trusted Publisher
# signal). Early indicator of account compromise.
trustPolicy: no-downgrade

# Targeted bypasses for trustPolicy. Each entry is a security review.
trustPolicyExclude:
  # `@types/node@22.20.0` pulls `undici-types@6.21.0` (2 years old, no
  # provenance) while later versions had provenance. Pinning to this
  # specific selector means a future genuine downgrade still trips the
  # policy. Revisit when @types/node ships a build that doesn't depend on
  # the un-provenanced undici-types release.
  - "undici-types@6.21.0"
