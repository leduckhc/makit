name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or pain point — not just the proposed solution.
      placeholder: When I'm away from my desk I can't tell whether an agent is waiting on me because…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see. Rough ideas are fine.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - App (Flutter client)
        - Server (Node/TS)
        - Pairing / transport
        - Agent adapter (pi / codex / claude-code)
        - macOS menu-bar / tray
        - Onboarding
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or prior art.
