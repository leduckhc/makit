name: Flutter Security + Lint CI

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/flutter-ci.yml'

jobs:
  lint-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/flutter/
            ~/.pub-cache/
          key: ${{ runner.os }}-flutter-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install Flutter dependencies (lockfile-locked)
        run: |
          cd app
          flutter pub get --enforce-lockfile

      - name: Run analysis (strict linting)
        run: |
          cd app
          flutter analyze --no-pub --fatal-infos

      - name: Check code formatting
        run: |
          cd app
          dart format --output=none --set-exit-if-changed lib test

      - name: Check for vulnerable packages
        run: |
          cd app
          flutter pub outdated || true
        continue-on-error: true  # Advisory only, doesn't block CI

      - name: Verify pubspec.lock integrity
        run: |
          cd app
          if ! git diff --exit-code pubspec.lock > /dev/null; then
            echo "ERROR: pubspec.lock would be modified by pub get"
            echo "This indicates a lockfile inconsistency or manual edit."
            echo "Run: flutter pub get && git add pubspec.lock"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Install Flutter dependencies
        run: |
          cd app
          flutter pub get --enforce-lockfile

      - name: Run tests
        run: |
          cd app
          flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./app/coverage/lcov.info
          flags: flutter
        continue-on-error: true  # Coverage upload is advisory; test failures block above

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Install Flutter dependencies
        run: |
          cd app
          flutter pub get --enforce-lockfile

      - name: Check for known CVEs in dependencies
        run: |
          cd app
          flutter pub outdated 2>&1 | tee /tmp/outdated.txt
          # Grep for known-critical packages (e.g., if any are severely outdated)
          if grep -i "is not available" /tmp/outdated.txt; then
            echo "WARNING: Some packages may have been yanked or are inaccessible."
          fi
        continue-on-error: true
