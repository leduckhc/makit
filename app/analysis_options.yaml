# Static analysis settings. See SECURITY.md → "Static analysis".
#
# Source of truth for which lints fail the build. Keep this aligned with
# tool/audit.sh which runs `flutter analyze --fatal-infos --fatal-warnings`.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Codegen-friendly defaults.
    invalid_annotation_target: ignore
    # Treat these as build-failing.
    unused_import: warning
    dead_code: warning
    todo: info
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # — Security-adjacent —
    avoid_print: true                       # don't leak data via stdout
    avoid_web_libraries_in_flutter: true    # no dart:html in app code
    secure_pubspec_urls: true               # https-only urls in pubspec
    # `unsafe_html` was removed in Dart 3.7; SafeHtml is now the only path
    use_build_context_synchronously: true   # no stale-context after await

    # — Correctness / null safety —
    always_declare_return_types: true
    avoid_dynamic_calls: true
    no_runtimeType_toString: true
    no_self_assignments: true
    no_wildcard_variable_uses: true
    null_check_on_nullable_type_parameter: true
    prefer_void_to_null: true
    unnecessary_null_aware_assignments: true
    unrelated_type_equality_checks: true

    # — Performance —
    avoid_function_literals_in_foreach_calls: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

    # — Style consistency with existing code —
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_pub_dependencies: false   # pubspec.yaml is hand-grouped
    omit_local_variable_types: false
    prefer_final_locals: true
    prefer_final_in_for_each: true
