name: pino
description: Mobile-first coding agent client — chat UI for codex/pi/claude sessions on your desktop.
publish_to: "none"
version: 0.1.0

# Pub integrity (see SECURITY.md):
#   - Commit pubspec.lock. Never edit by hand.
#   - CI uses `flutter pub get --enforce-lockfile`.
#   - To update a dep: edit constraint, run `flutter pub upgrade <name>`,
#     review the lockfile diff, commit both files.

environment:
  # Flutter 3.22.0+ ships TLS hardening (badCertificateCallback contract)
  # that the cert-pinning transport relies on. Don't relax this.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"  # multicast_dns 0.3.3+ requires Flutter 3.38

dependencies:
  flutter:
    sdk: flutter

  # ---------------- pure-Dart utilities (pub.dev verified publishers) ------
  # `^` allows compatible minor/patch updates. Lockfile pins the exact
  # resolved version; enforce-lockfile in CI prevents drift.
  flutter_riverpod: ^3.0.0   # publisher: remi.rousselet
  go_router: ^17.0.0         # publisher: flutter.dev
  web_socket_channel: ^3.0.0 # publisher: dart.dev — TLS pin uses dart:io
  ulid: ^2.0.0
  collection: ^1.19.0        # publisher: dart.dev (≥1.19 required by flutter_test transitives)
  crypto: ^3.0.5             # publisher: dart.dev — SHA256 fingerprint of pinned server cert
  flutter_markdown_plus: ^1.0.7  # community-maintained fork of the discontinued flutter_markdown
  flutter_highlight: ^0.7.0  # publisher: pd4d10 — pure-Dart code syntax highlight
  markdown: ^7.2.1           # publisher: dart.dev — md.Element for the code builder
  flutter_svg: ^2.0.0           # publisher: flutter.dev — renders agent logo SVGs in the home
  liquid_glass_renderer: 0.2.0-dev.4  # publisher: whynotmake.it — iOS-26 glass.
  # Pinned exactly: experimental `-dev` prerelease, expect breaking API churn.

  # ---------------- security-critical native plugins -----------------------
  # Pinned exactly: native code = supply-chain blast radius. Bump deliberately
  # after reading the plugin's CHANGELOG and re-running `tool/audit.sh`.
  flutter_secure_storage: 10.3.1  # iOS Keychain / Android Keystore — bearer storage
  multicast_dns: 0.3.3+1         # publisher: flutter.dev — parses LAN multicast UDP
  url_launcher: 6.3.2            # publisher: flutter.dev — opens markdown links externally
  # Local notifications — buzz the user when a backgrounded agent finishes or
  # needs input. Pinned exactly (native code). Pulls in timezone + http
  # transitively (used by the plugin's scheduling API, which we don't call).
  flutter_local_notifications: 22.0.1  # publisher: dexterx.dev — MaikuB
  # SPEC-08 seam: the background notification-response isolate persists a
  # pending-action queue here (non-secret action metadata, drained by SPEC-07).
  shared_preferences: 2.5.3          # publisher: flutter.dev — pending-action queue
  # ---------------- SPEC-03 desktop control app (macOS only) ----------
  # Pinned exactly: tray_manager + window_manager have native Swift/Obj-C
  # code. qr_flutter is pure-Dart (safe for caret).
  tray_manager: 0.5.3                # publisher: leanflutter.dev — macOS menubar system tray
  window_manager: 0.5.2              # publisher: leanflutter.dev — macOS window sizing/position
  qr_flutter: ^4.1.0                 # publisher: theyakka.com — pure-Dart QR code rendering

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Codegen-only tools — never shipped in the app binary.
  flutter_launcher_icons: ^0.14.3  # publisher: docker.com — generates iOS/Android icon sets
  flutter_native_splash: ^2.4.4    # publisher: jonbegj.com — generates native launch screens

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/agents/
    - assets/tray/
